name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "supabase/functions/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Add Capacitor Android platform
        run: |
          if [ -d "android" ]; then
            echo "Android platform already exists — skipping 'npx cap add android'."
          else
            npx cap add android
          fi

      - name: Verify Android platform exists
        run: |
          if [ ! -d "android/app/src/main" ]; then
            echo "Error: Android platform was not created. 'npx cap add android' failed."
            exit 1
          fi
          echo "Android platform directory exists."

      - name: Configure AndroidManifest permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if [ ! -f "$MANIFEST" ]; then
            echo "AndroidManifest.xml not found"
            exit 1
          fi
          python3 - "$MANIFEST" <<'PY'
          import sys, xml.etree.ElementTree as ET

          ANDROID_NS = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", ANDROID_NS)

          p = sys.argv[1]
          tree = ET.parse(p)
          root = tree.getroot()

          needed = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
          ]
          existing = {
              el.get(f"{{{ANDROID_NS}}}name")
              for el in root.findall("uses-permission")
          }
          for perm_name in needed:
              if perm_name not in existing:
                  el = ET.Element("uses-permission")
                  el.set(f"{{{ANDROID_NS}}}name", perm_name)
                  root.insert(0, el)

          tree.write(p, encoding="utf-8", xml_declaration=True)

          rewritten = open(p, encoding="utf-8").read()
          ET.fromstring(rewritten)
          print(rewritten)
          PY
          grep -q 'android.permission.RECORD_AUDIO' "$MANIFEST"
          grep -q 'android.permission.MODIFY_AUDIO_SETTINGS' "$MANIFEST"
          echo "Verified microphone permissions in AndroidManifest.xml"

      - name: Sync web build to Android
        run: npx cap sync android

      - name: Add missing color resources
        run: |
          COLORS=android/app/src/main/res/values/colors.xml
          if [ ! -f "$COLORS" ]; then
            cat > "$COLORS" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#3B82F6</color>
              <color name="colorPrimaryDark">#1E40AF</color>
              <color name="colorAccent">#10B981</color>
          </resources>
          XML
            echo "Created colors.xml with missing color resources"
          else
            echo "colors.xml already exists"
          fi

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK integrity
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "Error: No APK file found"
            exit 1
          fi
          echo "APK found: $APK"
          ls -lh "$APK"
          unzip -t "$APK" > /dev/null 2>&1 || { echo "Error: APK is corrupt"; exit 1; }
          echo "APK integrity check passed"

      - name: Verify APK signing and alignment (read-only)
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "Error: No APK file found"
            exit 1
          fi

          echo "=== APK path and size ==="
          echo "Path: $APK"
          ls -lh "$APK"

          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "=== Signature verification ==="
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          if [ ! -f "$APKSIGNER" ]; then
            APKSIGNER=$(find "$ANDROID_HOME" -name apksigner -type f 2>/dev/null | head -1)
          fi
          if [ -n "$APKSIGNER" ] && [ -f "$APKSIGNER" ]; then
            echo "Using apksigner: $APKSIGNER"
            "$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1
          else
            echo "WARNING: apksigner not found — signature verification skipped"
          fi

          echo "=== Alignment verification ==="
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          if [ ! -f "$ZIPALIGN" ]; then
            ZIPALIGN=$(find "$ANDROID_HOME" -name zipalign -type f 2>/dev/null | head -1)
          fi
          if [ -n "$ZIPALIGN" ] && [ -f "$ZIPALIGN" ]; then
            echo "Using zipalign: $ZIPALIGN"
            "$ZIPALIGN" -c -v 4 "$APK" 2>&1
          else
            echo "WARNING: zipalign not found — alignment verification skipped"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rayyan-ai-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error
          
