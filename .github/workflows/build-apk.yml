name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "supabase/functions/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Add Capacitor Android platform
        run: npx cap add android

      - name: Verify Android platform exists
        run: |
          if [ ! -d "android/app/src/main" ]; then
            echo "Error: Android platform was not created. 'npx cap add android' failed."
            exit 1
          fi
          echo "Android platform directory exists."

      - name: Configure AndroidManifest for localhost cleartext
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if [ ! -f "$MANIFEST" ]; then
            echo "AndroidManifest.xml not found"
            exit 1
          fi
          python3 - "$MANIFEST" <<'PY'
          import sys, xml.etree.ElementTree as ET

          ANDROID_NS = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", ANDROID_NS)

          p = sys.argv[1]
          tree = ET.parse(p)
          root = tree.getroot()

          needed = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
          ]
          existing = {
              el.get(f"{{{ANDROID_NS}}}name")
              for el in root.findall("uses-permission")
          }
          for perm_name in needed:
              if perm_name not in existing:
                  el = ET.Element("uses-permission")
                  el.set(f"{{{ANDROID_NS}}}name", perm_name)
                  root.insert(0, el)

          app = root.find("application")
          if app is not None:
              cleartext_attr = f"{{{ANDROID_NS}}}usesCleartextTraffic"
              if app.get(cleartext_attr) is None:
                  app.set(cleartext_attr, "true")

          tree.write(p, encoding="utf-8", xml_declaration=True)

          rewritten = open(p, encoding="utf-8").read()
          ET.fromstring(rewritten)
          print(rewritten)
          PY

      - name: Sync web build to Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rayyan-ai-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          
