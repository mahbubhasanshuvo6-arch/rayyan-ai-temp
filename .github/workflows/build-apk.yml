name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "supabase/functions/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Add Android platform
        run: npx cap add android

      - name: Ensure microphone permission in Android manifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q 'android.permission.RECORD_AUDIO' "$MANIFEST"; then
            sed -i 's/<application/<uses-permission android:name="android.permission.RECORD_AUDIO" \/><application/' "$MANIFEST"
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Ensure app colors resource exists
        run: |
          mkdir -p android/app/src/main/res/values
          COLORS="android/app/src/main/res/values/colors.xml"
          if [ ! -f "$COLORS" ]; then
            cat > "$COLORS" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#2196F3</color>
              <color name="colorPrimaryDark">#1976D2</color>
              <color name="colorAccent">#2196F3</color>
          </resources>
          EOF
          fi

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Check APK file integrity
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' -print -quit)
          if [ -z "$APK" ]; then
            echo "ERROR: APK file was not generated."
            exit 1
          fi
          unzip -t "$APK"

      - name: Verify APK signature and alignment
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' -print -quit)

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "ERROR: APK file not found."
            exit 1
          fi

          echo "APK: $APK"
          ls -lh "$APK"

          BUILD_TOOLS="${ANDROID_HOME}/build-tools/36.0.0"
          APKSIGNER="${BUILD_TOOLS}/apksigner"
          ZIPALIGN="${BUILD_TOOLS}/zipalign"

          if [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose --print-certs "$APK"
          else
            echo "WARNING: apksigner was not found; signature verification skipped."
          fi

          if [ -x "$ZIPALIGN" ]; then
            "$ZIPALIGN" -c -v 4 "$APK"
          else
            echo "WARNING: zipalign was not found; alignment verification skipped."
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rayyan-ai-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
